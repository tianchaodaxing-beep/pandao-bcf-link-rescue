[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bcf-link-rescue"
version = "0.1.0"
description = "Reviewable BCF 2.1 component link recovery after IFC reexports"
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "MIT"
authors = [{name = "PANDAO", email = "tianchaodaxing@gmail.com"}]
dependencies = ["ifcopenshell==0.9.0"]

[project.scripts]
bcf-link-rescue = "bcf_link_rescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
